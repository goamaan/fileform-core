name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: /Applications/Xcode_26.2.app/Contents/Developer
          - runner: macos-14
            xcode: /Applications/Xcode_16.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      FILEFORM_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Prepare source verification
        run: command -v gpg || brew install gnupg
      - name: Build pinned local-only media pack
        run: Tools/build-media-pack.sh
      - name: Test image, document, table and media contracts
        run: swift test
      - name: Verify CLI end to end
        run: |
          Tools/smoke-cli.sh
          python3 Tools/smoke-transformations.py
          python3 Tools/smoke-editing.py
          python3 Tools/smoke-media-trim.py
      - name: Build development CLI delivery archive
        run: Tools/package-cli.sh --with-media
      - name: Retain development CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileform-cli-development-${{ matrix.runner }}
          path: Artifacts/releases/
          retention-days: 14
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-build-evidence-${{ matrix.runner }}
          path: |
            Artifacts/MediaPack/manifest.json
            Artifacts/MediaPack/build-flags.txt
            Artifacts/MediaPack/license-report.txt
            Artifacts/MediaPack/protocols.txt
            Artifacts/engine-build/configure.log
            Artifacts/engine-build/make.log
            Artifacts/engine-build/key-import.log
            Artifacts/engine-build/verification.log
            Artifacts/engine-build/verification.txt
          retention-days: 14
